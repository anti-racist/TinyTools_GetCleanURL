<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auto Clean URL</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <label class="row">
        <span class="label">Clean links automatically</span>
        <input id="toggle" type="checkbox" role="switch" disabled>
    </label>
    <p id="status" class="status" role="status"></p>
    <label class="row sub">
        <span>Show on the icon how many were removed</span>
        <input id="badge" type="checkbox" disabled>
    </label>
    <p class="note">Removes utm_ tags, fbclid, gclid and other common tracking parameters as each page opens.</p>
    <section class="log" aria-labelledby="log-title">
        <h2 id="log-title">Test log</h2>
        <p id="log-summary" class="note"></p>
        <ol id="log-list" class="log-list"></ol>
        <div class="buttons">
            <button id="copy-log" type="button">Copy log</button>
            <button id="clear-log" type="button">Clear</button>
        </div>
        <p class="note">Names only, never their values. "Missed" is what Get Clean URL's click would also remove.</p>
    </section>
    <script type="module" src="popup.js"></script>
</body>
</html>
